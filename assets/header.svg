<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#062a2f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1e3a44" stroke-width="1"/>
    </pattern>
    <clipPath id="typeClip">
      <rect x="80" y="170" height="50" width="0">
        <animate attributeName="width" values="0;585;585;0" keyTimes="0;0.45;0.85;1" dur="7s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
    <style>
      .name{font:700 58px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#f8fafc;opacity:0;animation:rise 1.2s ease-out .2s forwards}
      .hello{font:500 20px 'Consolas','Courier New',monospace;fill:#2dd4bf;opacity:0;animation:rise 1s ease-out forwards}
      .role{font:600 30px 'Consolas','Courier New',monospace;fill:url(#accent)}
      .tags{font:500 16px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#94a3b8;opacity:0;animation:rise 1s ease-out 1.2s forwards}
      .cursor{animation:blink 1s steps(1) infinite}
      .float{animation:float 6s ease-in-out infinite}
      .f2{animation-delay:-2s}.f3{animation-delay:-4s}
      .spin{transform-origin:1000px 160px;animation:spin 30s linear infinite}
      .pulse{transform-origin:1000px 160px;animation:pulse 3s ease-in-out infinite}
      @keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
      @keyframes blink{50%{opacity:0}}
      @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
      @keyframes spin{to{transform:rotate(360deg)}}
      @keyframes pulse{0%,100%{opacity:.35;transform:scale(1)}50%{opacity:.8;transform:scale(1.08)}}
    </style>
  </defs>

  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="18" fill="url(#grid)" opacity=".6"/>

  <!-- orbit graphic (right) -->
  <circle class="pulse" cx="1000" cy="160" r="70" fill="none" stroke="#2dd4bf" stroke-width="2"/>
  <g class="spin">
    <circle cx="1000" cy="160" r="115" fill="none" stroke="#1e3a44" stroke-width="2" stroke-dasharray="6 10"/>
    <circle cx="1115" cy="160" r="9" fill="#38bdf8"/>
    <circle cx="885" cy="160" r="7" fill="#2dd4bf"/>
    <circle cx="1000" cy="45" r="6" fill="#a78bfa"/>
  </g>
  <text x="1000" y="152" text-anchor="middle" font-family="Consolas,monospace" font-size="22" font-weight="700" fill="#2dd4bf">{ }</text>
  <text x="1000" y="182" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#94a3b8">API · DATA</text>

  <!-- floating data dots -->
  <circle class="float" cx="760" cy="70" r="4" fill="#38bdf8"/>
  <circle class="float f2" cx="820" cy="250" r="5" fill="#2dd4bf"/>
  <circle class="float f3" cx="700" cy="270" r="3" fill="#a78bfa"/>

  <!-- text -->
  <text class="hello" x="80" y="80">~/copirlo20 $ ./hello.sh</text>
  <text class="name" x="80" y="148">Nguyễn Trọng Đạt</text>
  <g clip-path="url(#typeClip)">
    <text class="role" x="80" y="205">Backend Engineer &amp; Data Engineer</text>
  </g>
  <rect class="cursor" x="80" y="180" width="14" height="30" fill="#2dd4bf">
    <animate attributeName="x" values="84;669;669;84" keyTimes="0;0.45;0.85;1" dur="7s" repeatCount="indefinite"/>
  </rect>
  <text class="tags" x="80" y="262">Java · Spring Boot · C# · .NET · Node.js · Python · SQL · NoSQL · Docker</text>
</svg>
